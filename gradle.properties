# 编译并行（2026-09-25 用户要求："编译尽可能用多线程，单线程太慢了"）：
#   parallel  = 多 project 任务并行
#   caching   = 复用上一次的编译/测试输出（改一个文件不必重跑全部）
#   daemon    = 复用常驻 JVM，省掉每次 ~10s 的启动与类加载
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
