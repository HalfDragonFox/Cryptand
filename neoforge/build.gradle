// ⚠ VEIL jar-in-jar：把 veil jar 作为【二进制条目】写入产物 META-INF/jarjar/（随空壳
//   @Mod("sable") 一起分发；不用 sable 时整体不装 veil）。Gradle `from(jar)` 会自动把
//   归档解压，因此这里用 ZipOutputStream 手动注入单个字节条目（参考官方 sable 内嵌 veil）。
//   注意：Loom remap 步骤会重写 metadata.json 并丢弃 veil 条目，因此本任务必须
//   挂在 remapJar【之后】运行，注入 veil.jar 并【合并】metadata.json 里的 veil 声明。
def injectVeilJarTask = tasks.register('injectVeilJar') {
    inputs.file('libs/veil-neoforge-1.21.1-4.1.4.jar')
    dependsOn remapJar
    def veilJarPath = 'META-INF/jarjar/veil-neoforge-1.21.1-4.1.4.jar'
    def metadataPath = 'META-INF/jarjar/metadata.json'
    def veilEntryJson = '''{
        "identifier": { "group": "foundry.veil", "artifact": "veil-neoforge-1.21.1" },
        "version": { "range": "[4.1.4,)", "artifactVersion": "4.1.4" },
        "path": "META-INF/jarjar/veil-neoforge-1.21.1-4.1.4.jar",
        "isObfuscated": false
    }'''
    doLast {
        def veilSrc = file('libs/veil-neoforge-1.21.1-4.1.4.jar')
        def veilBytes = veilSrc.bytes
        def target = remapJar.archiveFile.get().asFile
        def tmp = new File(target.parentFile, target.name + '.tmp')

        // read whole jar into memory (rebuild with veil + merged metadata)
        def zis = new java.util.zip.ZipInputStream(new java.io.FileInputStream(target))
        boolean veilPresent = false
        String metadata = null
        byte[] metadataBytes = null
        java.util.LinkedHashMap<String, byte[]> entries = new java.util.LinkedHashMap<>()
        // ordered rebuild; skip veil jar & metadata first, re-add after
        def toAdd = []
        def veilEntryData = null
        try {
            java.util.zip.ZipEntry e
            while ((e = zis.nextEntry) != null) {
                if (e.name == veilJarPath) { veilPresent = true; veilEntryData = zis.readAllBytes(); continue }
                def data = zis.readAllBytes()
                entries.put(e.name, data)
                if (e.name == metadataPath) { metadata = new String(data, java.nio.charset.StandardCharsets.UTF_8) }
            }
        } finally { zis.close() }

        // merge veil entry into metadata json
        final boolean vs = veilPresent
        final String veilEntryStr = veilEntryJson
        String newMetadata = null
        if (metadata == null) {
            newMetadata = '{"jars": [' + veilEntryStr + ']}'
        } else {
            def merged = new groovy.json.JsonBuilder()
            def obj = new groovy.json.JsonSlurper().parseText(metadata)
            def jars = obj instanceof Map && obj.jars != null ? obj.jars : []
            def existing = jars.find { it.path instanceof String && it.path == veilJarPath }
            if (existing == null) {
                jars.add(new groovy.json.JsonSlurper().parseText(veilEntryStr))
            }
            newMetadata = new groovy.json.JsonBuilder(obj).toString().replace('::', ':')
            // JsonBuilder escapes nothing here; ensure veil path entry retained
        }
        metadataBytes = newMetadata.getBytes(java.nio.charset.StandardCharsets.UTF_8)

        def zos = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tmp))
        try {
            for (def entry : entries.entrySet()) {
                if (entry.key == metadataPath) continue // re-add later
                zos.putNextEntry(new java.util.zip.ZipEntry(entry.key))
                zos.write(entry.value)
                zos.closeEntry()
            }
            // veil jar (binary)
            zos.putNextEntry(new java.util.zip.ZipEntry(veilJarPath))
            zos.write(veilBytes)
            zos.closeEntry()
            // merged metadata
            zos.putNextEntry(new java.util.zip.ZipEntry(metadataPath))
            zos.write(metadataBytes)
            zos.closeEntry()
        } finally { zos.close() }

        if (!target.delete()) { throw new RuntimeException('cannot delete ' + target) }
        if (!tmp.renameTo(target)) { throw new RuntimeException('cannot rename to ' + target) }
        logger.lifecycle('Injected veil jar-in-jar + metadata into {}', target)
    }
}

remapJar {
