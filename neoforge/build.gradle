buildscript {
    dependencies {
        // ASM：patchSableJar 清空官方 @Mod 类构造（禁官方初始化）用。
        classpath 'org.ow2.asm:asm:9.7'
        classpath 'org.ow2.asm:asm-tree:9.7'
    }
}

plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    // Scala 编译链（2026-09-27：真彩屏「全套移植 OC 屏幕代码（Scala）」的前提）。
    // 只用【编译期】：运行期的 scala 运行时由 OC 的语言提供者 kotori_scala 提供（见 dependencies）。
    id "scala"
}

// Scala 版本事实来源（不是记忆，逐条可查）：
//   ① 运行期那份 scala 运行时 = runtimeOnly 的 Scalable Cat's Force
//      （curse.maven:scalable-cats-force-320926:5527136 = 3.3.3-build-15）jar 根部的
//      `library.properties`：version.number=2.13.12、maven.version.number=2.13.12；
//      该 jar 的 MANIFEST：Automatic-Module-Name=kotori_scala、FMLModType=LIBRARY、
//      Implementation-Version=3.3.3-build-15 —— 即 OC 的 modLoader="kotori_scala" /
//      loaderVersion="[3.3.3-build-15,4)"（OC jar 的 META-INF/neoforge.mods.toml）所依赖的那个提供者。
//   ② OC 自己也这么定：`.ai_cache/OpenComputers/gradle.properties:9`
//      「Scala 2.13.12 is bundled in the OpenComputers JAR」+
//      `.ai_cache/OpenComputers/build.gradle:227` embedded("org.scala-lang:scala-library:2.13.12")。
// ⇒ 我们编译期必须用同一份 2.13.12，否则 Scala 生成的字节码会引用运行期不存在的符号。
def scalaLibraryVersion = rootProject.findProperty('scala_version') ?: '2.13.12'

repositories {
    // LDLib2 官方发布仓库（snapshots 持续构建）
    maven { url = "https://maven.firstdark.dev/snapshots" }
    // CEE（Create-Electro-Energetics，2026-08-22 测试运行/对接用）
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://cursemaven.com" }
    // CEE 运行时库（sable / offroad）
    maven { url = "https://maven.ryanhcode.dev/releases" }
    // JEI（LDlib 集成需要，2026-08-22 版本不足报错修复）
    maven { url = "https://maven.blamejared.com/" }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// ⚠ 2026-08-30 改回原本加载模式：删除 engineSrc（copyEngineSource）方案——
// common 以【库】直接进运行 classpath（见 configurations 的 developmentNeoForge/
// runtimeClasspath += common sourceSet output），不再复制源码进 neoforge 编译。
// 原因：engineSrc 增量/缓存反复误判 UP-TO-DATE → 运行缺 common 类
//（NativeMath/ReadWriteGate/WirePoint ClassNotFound）；库 classpath 不经
// MOD_CLASSES → 不触发 Registrate "unused register callbacks" 崩溃，安全。

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    // LDLib2 官方 jar 专用配置：编译期 + 构建期 patch 用（运行时用 patched 版）
    ldlib2Official
}

dependencies {
    // ⚠ 2026-08-30 改回原本加载模式：common jar（库，非 mod）直接进
    // developmentNeoForge（NeoForge dev 运行 classpath）——dev 运行时 common 类
    // 从 common jar 加载，不经 engineSrc 复制（消除 engineSrc 增量/缓存误判
    // 导致的运行缺类）。用 jar 文件而非输出目录（Architectury Transformer 只
    // 按 jar 打开 classpath 条目）。runtimeClasspath 为解析配置不可声明依赖。
    developmentNeoForge files(project(':common').jar.archiveFile.get().asFile)
}

// ⚠ 2026-08-30 改回原本加载模式：common 编译输出（库）进运行 classpath——
// 见下方 configurations 块（developmentNeoForge/runtimeClasspath += common output）。
// 库 classpath 不触发 Registrate MOD_CLASSES 检查（安全）；common 改码后
// runClient 自动用最新输出（无 engineSrc UP-TO-DATE 误判问题）。

// ⚠ 2026-09-01：官方 sable 系（dev.ryanhcode.sable）——不再做空壳，改为【加载官方
    //   完整 jar 但禁止其运行】：
    //   - 编译期引入官方 sable jar（类签名完整，供核心/兼容包引用、供其他 mod mixin 不崩）；
    //   - 运行时用 patchSableJar 产出的【纯类库版】（去掉 neoforge.mods.toml → 不注册为
    //     mod、不初始化 @Mod("sable")；去掉 sable*.mixins.json → ban 官方全部 mixins；
    //     去掉 META-INF/services/ → 不触发官方平台实现；去掉 jarjar/ → 不带官方 rapier/veil natives）。
    //   - modId="sable" 仍由 CryptandSableMod（空壳 @Mod("sable")）提供，满足依赖检查。
    //   - 仍全局排除坐标依赖：第三方 mod 传递带 sable 官方 jar 会与我们的纯类库版重复，
    //     必须排除；官方 jar 仅按本地 files 显式引入（不受 exclude 影响）。
configurations.all {
    exclude group: 'dev.ryanhcode.sable'
}

sourceSets {
    main {
        java {
            // （engineSrc 方案已删除——2026-08-30 改回 common 库加载）
        }
        // 编译期使用官方 LDLib2 jar（运行时用 patched 版）
        compileClasspath += configurations.ldlib2Official
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    neoForge {
        // NeoForge handles mixins via mods.toml
    }

    runs {
        client {
            // 自动进入最新测试世界（2026-09-01 调试物理化用；可改为 false）
            if (project.hasProperty("quickPlayWorld")) {
                programArgs "--quickPlaySingleplayer", project.getProperty("quickPlayWorld")
            }
            // 键盘/组件调用诊断（2026-09-25）：gradlew :neoforge:runClient -PdebugCalls
            //   ⇒ -Dcryptand.debug.calls=1：逐次打印键盘信号形态与注入字节（默认静默）
            if (project.hasProperty("debugCalls")) {
                vmArg "-Dcryptand.debug.calls=1"
            }
        }
        server {
        }
    }
}

// ===== LDLib2 官方 jar 自动 patch =====
// 官方 2.2.35 的以下 mixin 引用了 NeoForge 21.1.231（Mojang 重构）中已不存在的 lambda，
// required=true 注入失败后 MixinExtras 已生成损坏的 bridge 字节码 → VerifyError/崩溃：
//   - BlockStateModelLoaderMixin : lambda$loadBlockStateDefinitions$10（客户端模型加载）
//   - WorldLoaderMixin          : lambda$load$0（进入世界时 WorldLoader 加载）
// 均已用 javap 验证在 21.1.231 中不存在。其余 lambda mixin（如 ServerPlayerMixin
// lambda$openMenu$15）经验证存在，正常保留。
// （-Dmixin.env.ignoreRequired 无效：bridge 已生成）。
// 本任务从官方 jar 复制并仅移除这些 mixin（其余内容/元数据原样保留），
// 运行时使用 patched 版，依赖声明仍用官方坐标、版本可升级。
def patchLdlib2Task = tasks.register('patchLdlib2Jar') {
    def inJar = project.provider { configurations.ldlib2Official.singleFile }
    def outJar = layout.buildDirectory.file("ldlib2-patched/ldlib2-${rootProject.ldlib2_version}-patched.jar")
    inputs.file(inJar)
    outputs.file(outJar)
    doLast {
        def src = inJar.get()
        def dst = outJar.get().asFile
        dst.parentFile.mkdirs()
        def zis = new java.util.zip.ZipInputStream(new java.io.FileInputStream(src))
        def zos = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(dst))
        zis.withCloseable {
            zos.withCloseable {
                java.util.zip.ZipEntry entry
                while ((entry = zis.nextEntry) != null) {
                    def ne = new java.util.zip.ZipEntry(entry)
                    zos.putNextEntry(ne)
                    if (entry.name == 'ldlib2.mixins.json') {
                        def content = new String(zis.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
                        def newContent = content
                                .replace('    "BlockStateModelLoaderMixin",\n', '')
                                .replace('    "WorldLoaderMixin",\n', '')
                        zos.write(newContent.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                    } else {
                        def buf = new byte[8192]
                        int n
                        while ((n = zis.read(buf)) > 0) { zos.write(buf, 0, n) }
                    }
                    zos.closeEntry()
                }
            }
        }
        if (!dst.exists()) {
            throw new GradleException("patchLdlib2Jar 失败: 未生成 " + dst)
        }
        logger.lifecycle("LDLib2 patched jar: {}", dst)
    }
}

// ⚠ 2026-09-01：官方 sable jar → 惰性 mod（patchSableJar）。
//   官方 jar（libs/sable-neoforge-1.21.1-2.0.3.jar）作为【可识别 mod】加载，但【不运行】：
//   - 【保留】重写后的 neoforge.mods.toml（modId="sable" + neoforge/minecraft 依赖）→
//     FML 把 sable 识别为已安装 mod → 官方 805 类进入 ModuleLayer（其他 mod 对
//     dev.ryanhcode.sable.* 的 mixin / 依赖检查 / 惰性引用全部可见，不再 ClassNotFound）。
//   - 【保留】官方 @Mod 类（SableNeoForge / SableNeoForgeClient），但用 ASM 清空其
//     <init> 构造方法体（仅保留 super）→ FML 实例化 mod 成功，但官方初始化
//     （Sable.init/SableClient.init → TCP/tags/blockProperty/ForceGroups/DLL）全部不执行。
//   - 【剔除】sable*.mixins.json（ban 官方全部 mixins）、META-INF/services/（不触发官方
//     platform 实现）、META-INF/jarjar/（不带官方 rapier DLL/companion/veil）。
//   - 官方主类不初始化 + 无 services + 无 jarjar → 官方"可见不可动"。
//   - 不随 cryptand jar 分发：仅作为 dev 运行时 classpath mod（生产如需分发走 jar-in-jar）。
def patchSableJar = tasks.register('patchSableJar') {
    def src = file('libs/sable-neoforge-1.21.1-2.0.3.jar')
    def dst = layout.buildDirectory.file("sable-patched/sable-neoforge-1.21.1-2.0.3-classes.jar")
    inputs.file(src)
    outputs.file(dst)
    doLast {
        if (!src.exists()) {
            throw new GradleException("patchSableJar 失败: 缺少 " + src)
        }
        def out = dst.get().asFile
        out.parentFile.mkdirs()

        // 重写后的 mods.toml（只保留 mod 识别 + required 依赖；去掉官方 mixins/services/jarjar 引用）
        def newModsToml = '''modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"

[[mods]]
modId = "sable"
version = "2.0.3"
displayName = "Sable"
authors = "RyanHCode"
description = \'\'\'Interactive moving block structures with physics.\'\'\'
logoFile = "icon.png"
logoBlur = false

[[dependencies.sable]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.228,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sable]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"
'''.stripIndent()

        def zis = new java.util.zip.ZipInputStream(new java.io.FileInputStream(src))
        def zos = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(out))
        zis.withCloseable {
            zos.withCloseable {
                java.util.zip.ZipEntry entry
                while ((entry = zis.nextEntry) != null) {
                    // 剔除：官方 mixins / services / jarjar（natives）。
                    // services/ 必须剔除：否则 ServiceLoader 会实例化官方 platform 实现
                    // （SableLoaderPlatformImpl 等）→ 触发官方运行（禁）。官方接口的服务
                    // 实现由 cryptand 在 cryptandsable_compat 提供（见 META-INF/services/）。
                    if (entry.name == 'sable.mixins.json' || entry.name == 'sable-neoforge.mixins.json') continue
                    if (entry.name.startsWith('META-INF/services/')) continue
                    if (entry.name.startsWith('META-INF/jarjar/')) continue
                    // mods.toml → 重写版本（FML 识别 mod，但不引用官方 mixins/services）
                    if (entry.name == 'META-INF/neoforge.mods.toml') {
                        zos.putNextEntry(new java.util.zip.ZipEntry(entry))
                        zos.write(newModsToml.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                        zos.closeEntry()
                        continue
                    }
                    // 官方 @Mod 类 → ASM 清空 <init> 构造（禁初始化）
                    if (entry.name == 'dev/ryanhcode/sable/neoforge/SableNeoForge.class'
                            || entry.name == 'dev/ryanhcode/sable/neoforge/SableNeoForgeClient.class') {
                        def bytes = zis.readAllBytes()
                        def cn = new org.objectweb.asm.tree.ClassNode()
                        new org.objectweb.asm.ClassReader(bytes).accept(cn, 0)
                        cn.methods.each { m ->
                            if (m.name == '<init>') {
                                m.instructions.clear()
                                m.instructions.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 0))
                                m.instructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKESPECIAL, cn.superName, '<init>', '()V', false))
                                m.instructions.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.RETURN))
                                m.maxLocals = 0
                                m.maxStack = 0
                                m.localVariables = null
                                m.tryCatchBlocks = null
                            }
                        }
                        def cw = new org.objectweb.asm.ClassWriter(org.objectweb.asm.ClassWriter.COMPUTE_MAXS)
                        cn.accept(cw)
                        def ne = new java.util.zip.ZipEntry(entry)
                        zos.putNextEntry(ne)
                        zos.write(cw.toByteArray())
                        zos.closeEntry()
                        continue
                    }
                    def ne2 = new java.util.zip.ZipEntry(entry)
                    zos.putNextEntry(ne2)
                    def buf = new byte[8192]
                    int n
                    while ((n = zis.read(buf)) > 0) { zos.write(buf, 0, n) }
                    zos.closeEntry()
                }
            }
        }
        if (!out.exists()) {
            throw new GradleException("patchSableJar 失败: 未生成 " + out)
        }
        logger.lifecycle("Sable inert-mod jar (mods.toml kept, @Mod init cleared): {}", out)
    }
}







dependencies {
    // 排除 common 传递来的 Fabric 依赖
    implementation(project(":common")) {
        exclude group: 'net.fabricmc'
    }

//    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) {
//        exclude group: 'net.fabricmc'
//        transitive = false
//    }

    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    // MixinExtras - 使用 include 嵌入
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(include("io.github.llamalad7:mixinextras-neoforge:0.4.1"))

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    // dev运行时Mod
    compileOnly("maven.modrinth:create-aeronautics:${rootProject.aeronautics_version}") { transitive = false }
    // ★ 2026-09-14：simulated（航空学的真实内容承载者）。
    //   create-aeronautics 的 jar 是 jarjar 聚合包（仅 10 个条目），真正代码在这三个嵌套 jar 里；
    //   本行用从中抽取出来的 simulated jar，只为【编译期】引用它的 ExtraKinetics API
    //   （外设模拟传动器按用户要求"最好使用原版的"——复用原版双 KBE 传动机制）。
    //   可选依赖：运行时没有 simulated 时，相关方块由 aeronautics 子包门控不注册。
    compileOnly(files('libs/dev.simulated_team.simulated.simulated-neoforge-1.21.1-1.3.0.jar'))
    compileOnly("maven.modrinth:create-electro-energetics:1.21.1-1.1.1") { transitive = false }
    // ⚠ SableCompanion API：编译期引用 companion-1.6.0 jar（libs/，从 CEE 内嵌 jarjar 抽取）。
    //   不打进 cryptand jar（否则与 CEE 内嵌的 sablecompanion mod 形成 JPMS split package）。
    //   运行时 companion 接口由 CEE 内嵌的 sablecompanion mod 提供，CryptandSableCompanion
    //   （ServiceLoader 最高优先级）实现之。生产打包 phase 用 jarJar 内嵌同版本以自举。
    compileOnly(files('libs/sable-companion-common-1.21.1-1.6.0.jar'))
    runtimeOnly("maven.modrinth:create-electro-energetics:1.21.1-1.1.1") { transitive = false }
    // ⚠ 2026-09-06（三轮：官方原版完整加载，patchSableJar 退役）：
    //   官方 sable 以【原版】作为可识别 mod 完整运行（官方 @Mod 构造/mixins/services/
    //   jarjar 全保留）——三模式语义：core 关（模式 C）官方正常使用；core 开（模式 A）
    //   CryptandSable 经 cryptandsable_compat 运行期禁跑官方（mixin 空化官方 loadLibrary、
    //   tickPipelinePhysics cancel 等）。官方 jar 编译可见，【绝不随 cryptand jar 分发】。
    compileOnly(files('libs/sable-neoforge-1.21.1-2.0.5.jar'))
    runtimeOnly(files('libs/sable-neoforge-1.21.1-2.0.5.jar'))
    runtimeOnly("dev.ryanhcode.offroad:offroad-neoforge-1.21.1:1.3.0") { exclude group: "cc.tweaked" }
    runtimeOnly("maven.modrinth:create-aeronautics:${rootProject.aeronautics_version}") { transitive = false }
    runtimeOnly("curse.maven:sable-schematic-tool-1526951:8606655")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${rootProject.jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${rootProject.jei_version}")
    // LDLib2 - UI 框架（2026-08-13 用户要求：UI 全部使用 ldlib，现代化）
    // 官方 firstdark 仓库版本（:all classifier 自带依赖分发，jarJar 内嵌 kotlin/yoga/taffy）
    // 编译期用官方 jar；运行时用 patchLdlib2Jar 生成的 patched 版（见下）
    ldlib2Official("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${rootProject.ldlib2_version}:all") {
        transitive = false   // :all 已 jarJar 内嵌 kotlin/yoga/taffy，避免传递依赖
    }
    // 运行时使用构建期自动 patch 的 LDLib2 jar（移除失效 mixin，规避进入世界崩溃）。
    // 必须用 runtimeOnly（而非 developmentNeoNeoForge）：developmentNeoForge 中的 jar
    // 会被 Architectury Transformer transform（需解析 LDLib2 的 EMI/KJS/AE2 等可选依赖类，
    // 缺失即崩溃）。runtimeOnly 只进运行时 classpath，ModDiscoverer 仍能发现该 mod。
    runtimeOnly files(patchLdlib2Task)
    // LDLib2 的布局引擎（LDLib2 运行时经 jarJar 内嵌，编译期需显式声明）：
    // LayoutStyle 同时支持 Yoga 与 Taffy 两套引擎
    compileOnly("dev.vfyjxf:taffy:1.1.4")
    compileOnly("org.appliedenergistics.yoga:yoga:1.0.0")
//    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("curse.maven:power-grid-${rootProject.powergrid_version}")
    // ⚠ VEIL（转接包）：官方 sable 2.0.3 通过 jarJar 内嵌 veil-neoforge-4.1.4，
    //   PhysicsBlockPropertyTypes 的字段类型引用 foundry.veil.platform.registry，
    //   下游 aeronautics/simulated/offroad 字节码按该类型 getstatic。沿用官方
    //   sable 内嵌的 veil jar（从官方 sable jar META-INF/jarjar 提取到 libs/）。
    //   用【本地文件依赖】（像 sable-companion 一样），避免 Loom 将其识别为 mod
    //   依赖而平铺展开（会覆盖自建 mods.toml）。编译期 + dev 运行 classpath 提供；
    //   生产分发用 processResources 把 veil jar 作为 jar-in-jar 随空壳一起打包。
    compileOnly(files('libs/veil-neoforge-1.21.1-4.1.4.jar'))
    // ★ 2026-09-06（三轮）：veil 不再 runtimeOnly 自持——官方 sable 2.0.5 原版经 jarjar
    //   内嵌 veil 4.3.2（运行时随官方 mod 加载）；重复自持会双 veil（modId 冲突）。
    //   编译期签名仍用 libs/veil（4.1.4→4.3.2 API 兼容，运行期以官方 jarjar 4.3.2 为准）。
    // Pipez（2026-08-29 用户要求添加，dev 环境依赖，仅 neoforge）。
    // compileOnly = 编译期 API 可见（未来管道互通集成预留）；runtimeOnly = dev 运行加载。
    compileOnly("curse.maven:pipez-443900:${rootProject.pipez_version}") { transitive = false }
    runtimeOnly("curse.maven:pipez-443900:${rootProject.pipez_version}") { transitive = false }
    // Mekanism 官方组件套件（2026-08-29 用户要求 dev 环境加上；Pipez 气体管道需
    //   mekanism.api.chemical；CurseForge maven 文件 ID：10.7.19.85 批次；
    //   runtimeOnly = dev 运行加载）。主 jar + Generators + Additions + Tools。
    runtimeOnly("curse.maven:mekanism-268560:${rootProject.mekanism_version}") { transitive = false }
    runtimeOnly("curse.maven:mekanism-generators-268566:${rootProject.mekanism_generators_version}") { transitive = false }
    runtimeOnly("curse.maven:mekanism-additions-345425:${rootProject.mekanism_additions_version}") { transitive = false }
    runtimeOnly("curse.maven:mekanism-tools-268567:${rootProject.mekanism_tools_version}") { transitive = false }
//    runtimeOnly("curse.maven:distant-horizons-508933:8943824") { transitive = false }
    // OpenComputers Rebooted（2026-09-16 用户要求：dev 环境加载，作为 OC 参考实现，
    //   对照其「机箱 / 处理器(CPU/APU) / 内存条 / 硬盘 / 扩展卡」部件体系与外观）
    //   CurseForge projectId 1634364, fileId 8721690。
    //   runtimeOnly = 只进 dev 运行 classpath，不随模组分发；
    //   若将来要在代码里引用 OC API（写兼容/联动），改成：
    //     compileOnly("curse.maven:opencomputers-rebooted-1634364:8721690") { transitive = false }
    //     runtimeOnly("curse.maven:opencomputers-rebooted-1634364:8721690") { transitive = false }
    // ★ 必需前置：Scalable Cat's Force（CurseForge projectId 320926, fileId 5527136 =
    //   ScalableCatsForce-NeoForge-3.3.3-build-15-with-library，1.21/1.21.1 NeoForge）。
    //   它提供语言加载器 **kotori_scala**（Scala 运行库已随该 jar 内自带，无需额外依赖）。
    //   缺它 → FML 直接拒绝加载 OC 并导致游戏启动失败：
    //     "needs language provider kotori_scala:3.3.3-build-15 or above, and below 4 to load"
    runtimeOnly("curse.maven:scalable-cats-force-320926:5527136") { transitive = false }
    // ⚠ 2026-09-16：**1.9.4-3 有 bug 会崩**（鼠标悬停 OC 物品即崩）：
    //     NoSuchMethodError: TooltipFlag.shouldDisplayAllInformation()   ← 更高版本 MC 的 API
    //     at li.cil.oc.util.Tooltip$.showExtendedTooltip(Tooltip.scala:16)
    //   已实测：**只有 1.9.4-3 引用了该缺失方法**；1.9.4-2 / 1.9.4 / 1.9.3-5 都没有（二进制常量池核对）。
    //   因此改用 1.9.4-2（fileId 8614366，与 1.9.4-3 同代但无此缺陷）。
    // ⚠ 2026-09-16（P1）：我们的 opencomputers 子包**引用 OC 的 API**（li.cil.oc.api.*：
    //   DriverItem / Processor / Memory / Architecture / ExecutionResult / Driver.add）
    //   ⇒ 必须 compileOnly，否则编译期看不到 OC 类；runtimeOnly 保留（dev 运行加载）。
    compileOnly("curse.maven:opencomputers-rebooted-1634364:8614366") { transitive = false }
    runtimeOnly("curse.maven:opencomputers-rebooted-1634364:8614366") { transitive = false }
    // ===== Scala 编译链（2026-09-27：移植 OC 屏幕代码）=====
    // 只编译期需要 scala-library（证据见文件顶部 scalaLibraryVersion 注释）：
    // 运行期 scala.* 由 OC 的语言提供者 kotori_scala（Scalable Cat's Force，FMLModType=LIBRARY）
    // 唯一提供，全模组可见。这里必须 compileOnly —— 写成 implementation 会打进第二份
    // scala 运行时（OC 自己就为这个坑做了 RelocateScalaJar，见
    // .ai_cache/OpenComputers/buildSrc/.../RelocateScalaJar.java:20-23）。
    compileOnly("org.scala-lang:scala-library:${scalaLibraryVersion}")

    // 第三方库：需要随模组一起分发，使用 implementation + include
    implementation(include('org.apache.commons:commons-math3:3.6.1'))
    implementation(include('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura'))
    implementation(include('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura'))
    implementation "curse.maven:kotlin-for-forge-351264:8335665"
    implementation "curse.maven:observable-509575:6697124"

    implementation 'com.google.code.gson:gson:2.11.0'

    // SQLite - 随 mod 分发（2026-08-14 修复：必须 include 才会进入 Loom dev
    // 运行时 mod classpath——否则 Class.forName("org.sqlite.JDBC") 在 mod 类加载
    // 器找不到驱动 → SQLException: SQLite JDBC driver not found → SQLite 从未打开
    // → 导线无法存档/恢复。与 commons-math3 等第三方库同模式）
    implementation(include("org.xerial:sqlite-jdbc:${rootProject.sqlite_version}"))
    shadowCommon "org.xerial:sqlite-jdbc:${rootProject.sqlite_version}"

    // COM 串口对接库（2026-09-08）：include = jar-in-jar 随 mod 分发（dev 运行经 common 传递依赖）
    implementation(include("com.fazecast:jSerialComm:${rootProject.serialcomm_version}"))
    // 方向盘 DirectInput8 后端（2026-09-08）：JNA 随 mod 分发
    implementation(include("net.java.dev.jna:jna:${rootProject.jna_version}"))

    // 重新声明 shadowCommon 并排除 Fabric (确保传递依赖中无 fabric-loader)
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) {
        exclude group: 'net.fabricmc'
        transitive = false
    }
}

// Scala 编译选项：照 OC build.gradle:490-493（同一 MC 1.21.1 / NeoForge 版本的实际配置）——
// 只调 fork 内存与线程栈，不动 -target（OC 同样不动）。
// Java 编译需要看见 Scala 编译产物（本项目两者输出到同一目录 classes/java/main）：
//   compileScala 用 -sourcepath 解析 Java 源码，Java 侧则要把该输出目录加进 classpath，
//   否则 javac 只在源集内部寻找 ⇒ 找不到 Scala 类（SocPairingData → truescreen...Screen）。
tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.forkOptions.memoryMaximumSize = '2g'
    scalaCompileOptions.forkOptions.jvmArgs = ['-Xss4m']
    // 打破 Java↔Scala 循环依赖（2026-09-29）：
    //   compileJava 需要 Scala 类（SocPairingData → truescreen...Screen.scala）
    //   compileScala 需要 Java 类（TrueScreenRegistrarImpl → TrueScreenRegistrar.java）
    //   ⇒ 让 Scala 编译器直接解析未编译的 Java 源码，不必等 classes/java/main。
    scalaCompileOptions.additionalParameters += ['-sourcepath', file('src/main/java').absolutePath]
}

// ⚠⚠ dev 运行期的类可见性（2026-09-27 真机取证后的**根因修复**）
//
// 故障：真机 runClient 日志
//   java.lang.ClassNotFoundException: com.hdf.cryptand.neoforge.truescreen.TrueScreenContent
//   （SocContent.registerTrueScreenContent）
//   ⇒ 移植件一个方块/BE/组件都没注册（创造栏没有、place 出来是 air、组件表 screen=0）。
//
// 取证（全部离线、可复核）：
//   ① 生成物 `.idea/runConfigurations/Minecraft_Client___neoforge__neoforge.xml` 的
//      `MOD_CLASSES`（Architectury Transformer 的 mod 类路径）只有
//        build/resources/main ; build/classes/java/main ; out/production/classes ; out/production/resources
//      ——**没有** build/classes/scala/main；该文件生成于 2026-07-02（本模块加 scala 源集之前），
//      之后没再生成过（改源码/编译都不会重写它）。
//   ② init-script 实探：`sourceSets.main.output.classesDirs` = [classes/java/main,
//      **classes/scala/main**]（Gradle 自己知道两个目录），`build/loom-cache/argFiles/runClient`
//      的 -classpath 也带上了 scala 目录 ⇒ 出问题的只是 MOD_CLASSES 那份按"一个 mod 一个类目录"
//      老布局写死的**生成物**。
//   ③ 生产 jar（remapJar）本来就含 scala 类（jar 任务取 sourceSets.main.output）⇒ 只 dev 受影响。
//
// 措施：让 scalac **直接产出到 java 类目录**，于是任何形态的 MOD_CLASSES（旧生成的、IDE 重新同步
//   的、Gradle 自己跑的）都能看见全部 mod 类。**不依赖 IDE 重新同步**，也不需要任何"运行期兜底"。
//   ⚠ 代价：compileJava 与 compileScala 共用输出目录 ⇒ Gradle 会关闭这两个任务的执行优化
//   （日志里出现一条 "overlapping outputs" warning），产物与功能不受影响。
tasks.named('compileScala') {
    destinationDirectory.set(project.layout.buildDirectory.dir('classes/java/main'))
}

processResources {
    inputs.property "version", project.version

    // 固件字节（common 是**单一来源**）：director 把 common 的 soc 目录纳入本任务的输入/输出。
    // ⚠ 为什么必须在这里（2026-09-25 踩了两次）：
    //   ① Architectury 自己的 processResources 只在"它自己重跑"时才把 common 的资源带过来，
    //      而 common 侧改固件**不会**改变它的输入 ⇒ 它长期 UP-TO-DATE，
    //      build/resources/main 里的 cryptand-os.bin 就永远停在第一次那份
    //      （实测：客户端拿 9/17 的旧固件跑了整整一轮，期间所有固件修复都没生效）；
    //   ② 反过来手动删掉那份过期副本 ⇒ 客户端直接"Boot 镜像缺失 ⇒ 保持关机"。
    //   放在这里的好处：依赖关系是**显式**的（runClient 本来就依赖 processResources），
    //   不再需要一个额外的 Sync 任务去挂 finalizedBy（那样 gradle 会报隐式依赖校验错误，
    //   runClient 直接 FAILED —— 实测）。
    from(project(':common').file('src/main/resources/assets/cryptand/soc')) {
