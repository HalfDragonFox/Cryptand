    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hdf.cryptand.core.concurrent.TxnSelfTest'
    jvmArgs = ['-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']   // 中文断言名在 GBK 控制台会乱码
}

// C++ 内核一致性自测（2026-09-17，用户"一步到 C++ 内核"后的回归闸门）：
//   ./gradlew :common:runNativeKernelTest
// 覆盖：native 解释器 vs 纯 Java 解释器（同固件同装配）→ 指令数 / PC / 寄存器 / 设备寄存器 逐项比对，
//       并确认 MMIO 事务确实由 Java 侧兑现（设备仍然是 Java 对象，soc 子包零改动）。
// DLL 缺失时打印 SKIP 正常退出（无 native 环境不阻塞）。
tasks.register('runNativeKernelTest', JavaExec) {
    group = 'verification'
    description = 'Run native (C++) RV32 kernel consistency self test against the Java kernel'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hdf.cryptand.soc.NativeKernelSelfTest'
    workingDir = rootProject.projectDir
    systemProperty 'cryptand.rv32.lib', rootProject.file('neoforge/run/config/cryptand/engines/cryptand_rv32.dll').absolutePath
}

