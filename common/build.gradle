// 事务调度框架自测（2026-09-28，纯 Java 零 MC）：
//   ./gradlew :common:runTxnTest
// 覆盖：申明集合严格升序校验 / 池稳态零分配与溢出退化 GC / 区块锁全得或全不得（绝不部分持有）/
//       双缓冲滞后一拍 / 先读后写相位隔离（读未清零不写、写未清零不碰主线程）/ 同区块写互斥。
